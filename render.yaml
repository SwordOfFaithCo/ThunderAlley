# One-click deploy on Render (free): Dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: thunderalley-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: echo no build needed
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      # Accounts and cloud saves live in a free Upstash Redis database
      # (upstash.com > Create database > REST API). Render asks for these on deploy.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Store (v3.17): see SHOP_SETUP.md. Leave empty until you set up Stripe / Google Play.
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_PLAY_PACKAGE
        value: com.thunderalley.game
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT
        sync: false
